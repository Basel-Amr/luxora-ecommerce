<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create your premium LUXORA shopping account."
    />
    <title>Create account | LUXORA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/all.css" />
    <link rel="stylesheet" href="css/register.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-card register-card" aria-labelledby="register-title">
        <a class="brand" href="index.html" aria-label="LUXORA home"
          ><span class="brand-mark">L</span><span>LUXORA</span></a
        >
        <div class="auth-heading">
          <p class="eyebrow">Your next chapter starts here</p>
          <h1 id="register-title">Create your account</h1>
          <p>Join a considered shopping experience built around you.</p>
        </div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
        <form id="register-form" novalidate>
          <div class="name-grid">
            <div class="field">
              <label for="first-name">First name</label
              ><input
                id="first-name"
                name="firstName"
                type="text"
                autocomplete="given-name"
                placeholder="Basel"
                required
              />
              <p class="field-error" data-error-for="firstName"></p>
            </div>
            <div class="field">
              <label for="last-name">Last name</label
              ><input
                id="last-name"
                name="lastName"
                type="text"
                autocomplete="family-name"
                placeholder="Amr"
                required
              />
              <p class="field-error" data-error-for="lastName"></p>
            </div>
          </div>
          <div class="field">
            <label for="email">Email address</label
            ><input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />
            <p class="field-error" data-error-for="email"></p>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                placeholder="Create a strong password"
                required
              /><button
                class="toggle-password"
                type="button"
                data-target="password"
                aria-label="Show password"
              >
                Show
              </button>
            </div>
            <div class="strength" aria-live="polite">
              <span class="strength-bar"></span
              ><span class="strength-label"
                >Use 8+ characters with upper, lower, number, and symbol.</span
              >
            </div>
            <p class="field-error" data-error-for="password"></p>
          </div>
          <div class="field">
            <label for="confirm-password">Confirm password</label>
            <div class="password-wrap">
              <input
                id="confirm-password"
                name="confirmPassword"
                type="password"
                autocomplete="new-password"
                placeholder="Repeat your password"
                required
              /><button
                class="toggle-password"
                type="button"
                data-target="confirm-password"
                aria-label="Show password"
              >
                Show
              </button>
            </div>
            <p class="field-error" data-error-for="confirmPassword"></p>
          </div>
          <label class="check-row terms-row"
            ><input id="terms" name="terms" type="checkbox" required />
            <span
              >I agree to the <a href="#">terms and conditions</a>.</span
            ></label
          >
          <p class="field-error" data-error-for="terms"></p>
          <button class="auth-button" type="submit">
            <span class="button-label">Create account</span
            ><span class="spinner" aria-hidden="true"></span>
          </button>
        </form>
        <p class="switch-auth">
          Already have a LUXORA account? <a href="login.html">Sign in</a>
        </p>
        <p class="security-note">
          Demo authentication · Never use localStorage auth for production
          secrets.
        </p>
      </section>
    </main>
    <script src="js/auth.js"></script>
    <script src="js/components/toast.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>
